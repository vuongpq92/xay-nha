<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Bản Vẽ Kết Cấu & Kích Thước Tầng 1 - Nhà Phố Quận 6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f8fafc;
      --paper-bg: #ffffff;
      --paper-border: #94a3b8;
      --cad-black: #0f172a;
      --cad-wall: #1e293b;
      --cad-column: #0f172a;
      --cad-dim: #dc2626;
      --cad-axis: #2563eb;
      --cad-furn: #0284c7;
      --cad-text: #0f172a;
      --cad-grid: #e2e8f0;
      --primary: #2563eb;
      --header-bg: rgba(15, 23, 42, 0.95);
      --header-text: #f8fafc;
    }

    body.theme-cad {
      --bg-canvas: #1e1e1e;
      --paper-bg: #121212;
      --paper-border: #334155;
      --cad-black: #f8fafc;
      --cad-wall: #ffffff;
      --cad-column: #e2e8f0;
      --cad-dim: #ef4444;
      --cad-axis: #60a5fa;
      --cad-furn: #38bdf8;
      --cad-text: #f1f5f9;
      --cad-grid: #262626;
      --header-bg: rgba(24, 24, 27, 0.95);
    }

    body.theme-blueprint {
      --bg-canvas: #0f2b48;
      --paper-bg: #0a1f36;
      --paper-border: #1e4976;
      --cad-black: #e0f2fe;
      --cad-wall: #ffffff;
      --cad-column: #bae6fd;
      --cad-dim: #fde047;
      --cad-axis: #38bdf8;
      --cad-furn: #7dd3fc;
      --cad-text: #ffffff;
      --cad-grid: #133355;
      --header-bg: rgba(10, 31, 54, 0.95);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-canvas);
      color: var(--cad-text);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      transition: background 0.3s;
    }

    /* TOP TOOLBAR */
    .cad-header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 50;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
      flex-wrap: wrap;
    }
    .cad-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .badge-scale {
      background: #2563eb;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'Roboto Mono', monospace;
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .cad-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .cad-btn:hover, .cad-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #3b82f6;
    }
    .cad-btn-link {
      background: #059669;
      color: #fff;
      border-color: #10b981;
      text-decoration: none;
    }
    .cad-btn-link:hover {
      background: #047857;
    }

    /* SUB TOOLBAR (LAYERS & CONTROLS) */
    .sub-toolbar {
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 6px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 40;
      color: #94a3b8;
      font-size: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sub-toolbar::-webkit-scrollbar { display: none; }
    .layer-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      color: #cbd5e1;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .layer-item:hover { background: rgba(255,255,255,0.1); }
    .layer-item input { cursor: pointer; accent-color: #2563eb; }

    /* VIEWPORT CONTAINER */
    #viewport-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-canvas);
      background-image: radial-gradient(var(--cad-grid) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    #viewport-container:active { cursor: grabbing; }

    /* SVG BOARD */
    #cad-svg {
      transform-origin: 0 0;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      border-radius: 2px;
      background: var(--paper-bg);
    }

    /* FLOAT CONTROLS ON BOTTOM RIGHT */
    .float-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 50;
    }
    .zoom-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.2s;
    }
    .zoom-btn:hover { background: #2563eb; transform: scale(1.08); }

    /* MOBILE FLOATING HINT */
    .nav-hint {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      color: #94a3b8;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: none;
    }

    @media print {
      body { overflow: visible; height: auto; background: #fff !important; }
      .cad-header, .sub-toolbar, .float-controls, .nav-hint { display: none !important; }
      #viewport-container { overflow: visible; background: #fff !important; width: 100%; height: auto; }
      #cad-svg { width: 100% !important; height: auto !important; transform: none !important; box-shadow: none !important; }
    }

    @media (max-width: 768px) {
      .cad-title span.title-text { font-size: 12.5px; }
      .cad-btn { padding: 5px 8px; font-size: 11px; }
      .badge-scale { display: none; }
      .nav-hint { display: none; }
    }
  </style>
</head>
<body class="theme-paper">

  <!-- TOP HEADER -->
  <header class="cad-header">
    <div class="cad-title">
      <span>📐</span>
      <span class="title-text">HỒ SƠ BẢN VẼ KẾT CẤU & KIẾN TRÚC TẦNG 1</span>
      <span class="badge-scale">TỶ LỆ 1/100</span>
    </div>

    <div class="toolbar-group">
      <!-- CHẾ ĐỘ XEM -->
      <button class="cad-btn active" id="btn-view-all" onclick="setViewMode('all')">📄 Cả 2 Mặt Bằng</button>
      <button class="cad-btn" id="btn-view-dim" onclick="setViewMode('dim')">📏 Kích Thước & Cột</button>

      <!-- THEME SWITCH -->
      <button class="cad-btn" id="btn-theme" onclick="cycleTheme()" title="Đổi màu nền">🎨 Nền Giấy In</button>

      <!-- IN ẤN -->
      <button class="cad-btn" onclick="window.print()" title="In ra giấy A3 hoặc lưu PDF">🖨️ In PDF</button>

      <!-- LIÊN KẾT 3D -->
      <a href="index.html" class="cad-btn cad-btn-link" title="Xem mô hình 3D tương tác">🏡 Xem Mô Hình 3D</a>
    </div>
  </header>

  <!-- SUB TOOLBAR: BẬT / TẮT LỚP (LAYERS) -->
  <div class="sub-toolbar">
    <div style="display: flex; gap: 14px; align-items: center;">
      <span style="font-weight: 700; color: #fff;">Bật/Tắt Lớp:</span>
      <label class="layer-item"><input type="checkbox" id="layer-axis" checked onchange="toggleLayer('layer-axis', this.checked)"> Lưới Trục A-B, 1-5</label>
      <label class="layer-item"><input type="checkbox" id="layer-dim" checked onchange="toggleLayer('layer-dim', this.checked)"> Đường Kích Thước (Dim)</label>
      <label class="layer-item"><input type="checkbox" id="layer-col" checked onchange="toggleLayer('layer-col', this.checked)"> Cột Kết Cấu 200x200</label>
      <label class="layer-item"><input type="checkbox" id="layer-wall" checked onchange="toggleLayer('layer-wall', this.checked)"> Tường Xây 200 & 100</label>
      <label class="layer-item"><input type="checkbox" id="layer-stair" checked onchange="toggleLayer('layer-stair', this.checked)"> Cầu Thang U 21 Bậc</label>
      <label class="layer-item"><input type="checkbox" id="layer-furn" checked onchange="toggleLayer('layer-furn', this.checked)"> Nội Thất & Thiết Bị</label>
    </div>
    <div style="font-family: 'Roboto Mono', monospace; font-size: 11px;">Thửa 22, Tờ 31, Q.6, TP.HCM</div>
  </div>

  <!-- INTERACTIVE SVG VIEWPORT -->
  <div id="viewport-container">
    <!-- SVG BẢN VẼ KHỔ A3 (1680 x 1188 px) -->
    <svg id="cad-svg" width="1680" height="1188" viewBox="0 0 1680 1188" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- HATCH CỘT BÊ TÔNG CỐT THÉP -->
        <pattern id="hatch-column" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="10" stroke="var(--cad-column)" stroke-width="2.5" />
        </pattern>
        <!-- GẠCH CHÉO 45 ĐỘ CHO DIM TICKS -->
        <marker id="dim-tick" markerWidth="8" markerHeight="8" refX="4" refY="4">
          <line x1="1" y1="7" x2="7" y2="1" stroke="var(--cad-dim)" stroke-width="1.8" />
        </marker>
        <!-- MŨI TÊN CHỈ HƯỚNG CẦU THANG -->
        <marker id="stair-arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 z" fill="var(--cad-axis)" />
        </marker>
      </defs>

      <!-- KHUNG BẢN VẼ TIÊU CHUẨN A3 (MARGIN 30px & 20px) -->
      <rect x="25" y="25" width="1630" height="1138" fill="none" stroke="var(--paper-border)" stroke-width="2" />
      <rect x="40" y="40" width="1600" height="1108" fill="none" stroke="var(--cad-black)" stroke-width="3" />

      <!-- KHUNG TÊN BẢN VẼ CHUẨN ĐỒ ÁN XÂY DỰNG (GÓC DƯỚI BÊN PHẢI) -->
      <g id="title-block" transform="translate(1040, 940)">
        <rect x="0" y="0" width="600" height="208" fill="none" stroke="var(--cad-black)" stroke-width="2" />
        <!-- Các đường chia ô -->
        <line x1="0" y1="40" x2="600" y2="40" stroke="var(--cad-black)" stroke-width="1.2" />
        <line x1="0" y1="80" x2="600" y2="80" stroke="var(--cad-black)" stroke-width="1.2" />
        <line x1="0" y1="120" x2="600" y2="120" stroke="var(--cad-black)" stroke-width="1.2" />
        <line x1="0" y1="160" x2="600" y2="160" stroke="var(--cad-black)" stroke-width="1.2" />
        <line x1="220" y1="0" x2="220" y2="208" stroke="var(--cad-black)" stroke-width="1.2" />
        <line x1="420" y1="80" x2="420" y2="208" stroke="var(--cad-black)" stroke-width="1.2" />

        <!-- Chữ trong khung tên -->
        <text x="110" y="25" font-size="13" font-weight="700" fill="var(--cad-text)" text-anchor="middle">ĐƠN VỊ TƯ VẤN THIẾT KẾ</text>
        <text x="110" y="62" font-size="12" font-weight="600" fill="var(--cad-text)" text-anchor="middle">CÔNG TY KIẾN TRÚC & XÂY DỰNG</text>
        <text x="110" y="105" font-size="11" fill="var(--cad-text)" text-anchor="middle">GIÁM ĐỐC / CHỦ TRÌ THIẾT KẾ</text>
        <text x="110" y="145" font-size="13" font-weight="700" fill="var(--cad-text)" text-anchor="middle">KTS. PHẠM TRIỀU TRUNG</text>
        <text x="110" y="188" font-size="11" fill="var(--cad-text)" text-anchor="middle">VẼ: KTS. PHẠM TRIỀU TRUNG</text>

        <text x="230" y="25" font-size="12" font-weight="600" fill="var(--cad-dim)">TÊN CÔNG TRÌNH:</text>
        <text x="350" y="25" font-size="13" font-weight="700" fill="var(--cad-text)">NHÀ Ở GIA ĐÌNH (1 TRỆT, 2 LẦU, 1 TUM)</text>

        <text x="230" y="62" font-size="12" font-weight="600" fill="var(--cad-dim)">ĐỊA ĐIỂM:</text>
        <text x="310" y="62" font-size="12" fill="var(--cad-text)">Thửa 22, Tờ 31, P. Bình Phú, Quận 6, TP.HCM</text>

        <text x="230" y="102" font-size="11" font-weight="600" fill="var(--cad-dim)">HẠNG MỤC:</text>
        <text x="230" y="142" font-size="13" font-weight="700" fill="var(--cad-text)">MẶT BẰNG KẾT CẤU & BỐ TRÍ TẦNG 1</text>
        <text x="230" y="185" font-size="11" fill="var(--cad-text)">GIAI ĐOẠN: BẢN VẼ THI CÔNG</text>

        <text x="435" y="102" font-size="11" font-weight="600" fill="var(--cad-dim)">TỶ LỆ:</text>
        <text x="500" y="102" font-size="13" font-weight="700" fill="var(--cad-axis)">1 / 100</text>
        <text x="435" y="142" font-size="11" font-weight="600" fill="var(--cad-dim)">SỐ BẢN VẼ:</text>
        <text x="520" y="142" font-size="14" font-weight="700" fill="var(--cad-text)">KT - 01</text>

      <!-- ========================================================================= -->
      <!-- BẢN VẼ 1: MẶT BẰNG KÍCH THƯỚC & KẾT CẤU TẦNG 1 (NỬA TRÁI / PLAN 1) -->
      <!-- Tọa độ gốc: X = 160, Y = 100 (Khổ nhà dài 10980mm -> 1098px, rộng 3450mm -> 345px) -->
      <!-- ========================================================================= -->
      <g id="plan-dim-group" transform="translate(180, 110)">
        <!-- TIÊU ĐỀ BẢN VẼ -->
        <text x="549" y="45" font-size="19" font-weight="700" fill="var(--cad-black)" text-anchor="middle" letter-spacing="1">MẶT BẰNG KÍCH THƯỚC TẦNG 1</text>
        <text x="549" y="72" font-size="13" font-weight="600" fill="var(--cad-axis)" text-anchor="middle" font-family="'Roboto Mono', monospace">TL: 1/100</text>
        <circle cx="549" cy="85" r="4" fill="var(--cad-dim)" />

        <!-- GỐC TỌA ĐỘ BẢN VẼ NHÀ TẠI (0, 140) -->
        <!-- Chiều ngang nhà: X từ 0 đến 1098 (10.98m). Trục 1: X=0, Trục 2: X=205, Trục 3: X=493, Trục 4: X=673, Trục 5: X=1098 -->
        <!-- Chiều sâu nhà: Y từ 140 (Trục B) đến 485 (Trục A: rộng 345mm). Trục A trên: Y=140, Trục B dưới: Y=485 -->

        <!-- 1. LƯỚI TRỤC ĐỊNH VỊ (AXES) -->
        <g id="layer-axis-plan1" class="cad-layer">
          <!-- Trục dọc A và B -->
          <!-- Trục B (Tường hông dưới) -->
          <line x1="-70" y1="140" x2="1170" y2="140" stroke="var(--cad-axis)" stroke-width="1.2" stroke-dasharray="14,4,3,4" />
          <circle cx="-50" cy="140" r="18" fill="var(--paper-bg)" stroke="var(--cad-axis)" stroke-width="2" />
          <text x="-50" y="146" font-size="15" font-weight="700" fill="var(--cad-axis)" text-anchor="middle">B</text>
          <circle cx="1150" cy="140" r="18" fill="var(--paper-bg)" stroke="var(--cad-axis)" stroke-width="2" />
          <text x="1150" y="146" font-size="15" font-weight="700" fill="var(--cad-axis)" text-anchor="middle">B</text>

          <!-- Trục A (Tường hông trên) -->
          <line x1="-70" y1="485" x2="1170" y2="485" stroke="var(--cad-axis)" stroke-width="1.2" stroke-dasharray="14,4,3,4" />
          <circle cx="-50" cy="485" r="18" fill="var(--paper-bg)" stroke="var(--cad-axis)" stroke-width="2" />
          <text x="-50" y="491" font-size="15" font-weight="700" fill="var(--cad-axis)" text-anchor="middle">A</text>
          <circle cx="1150" cy="485" r="18" fill="var(--paper-bg)" stroke="var(--cad-axis)" stroke-width="2" />
          <text x="1150" y="491" font-size="15" font-weight="700" fill="var(--cad-axis)" text-anchor="middle">A</text>

          <!-- Trục ngang 1, 2, 3, 4, 5 -->
          <!-- Trục 1 (X = 0) -->
          <line x1="0" y1="90" x2="0" y2="535" stroke="var(--cad-axis)" stroke-width="1.2" stroke-dasharray="14,4,3,4" />
          <circle cx="0" cy="555" r="18" fill="var(--paper-bg)" stroke="var(--cad-axis)" stroke-width="2" />
          <text x="0" y="561" font-size="15" font-weight="700" fill="var(--cad-axis)" text-anchor="middle">1</text>

          <!-- Trục 2 (X = 205) -->
          <line x1="205" y1="90" x2="205" y2="535" stroke="var(--cad-axis)" stroke-width="1.2" stroke-dasharray="14,4,3,4" />
          <circle cx="205" cy="555" r="18" fill="var(--paper-bg)" stroke="var(--cad-axis)" stroke-width="2" />
          <text x="205" y="561" font-size="15" font-weight="700" fill="var(--cad-axis)" text-anchor="middle">2</text>

          <!-- Trục 3 (X = 493) -->
          <line x1="493" y1="90" x2="493" y2="535" stroke="var(--cad-axis)" stroke-width="1.2" stroke-dasharray="14,4,3,4" />
          <circle cx="493" cy="555" r="18" fill="var(--paper-bg)" stroke="var(--cad-axis)" stroke-width="2" />
          <text x="493" y="561" font-size="15" font-weight="700" fill="var(--cad-axis)" text-anchor="middle">3</text>

          <!-- Trục 4 (X = 673) -->
          <line x1="673" y1="90" x2="673" y2="535" stroke="var(--cad-axis)" stroke-width="1.2" stroke-dasharray="14,4,3,4" />
          <circle cx="673" cy="555" r="18" fill="var(--paper-bg)" stroke="var(--cad-axis)" stroke-width="2" />
          <text x="673" y="561" font-size="15" font-weight="700" fill="var(--cad-axis)" text-anchor="middle">4</text>

          <!-- Trục 5 (X = 1098) -->
          <line x1="1098" y1="90" x2="1098" y2="535" stroke="var(--cad-axis)" stroke-width="1.2" stroke-dasharray="14,4,3,4" />
          <circle cx="1098" cy="555" r="18" fill="var(--paper-bg)" stroke="var(--cad-axis)" stroke-width="2" />
          <text x="1098" y="561" font-size="15" font-weight="700" fill="var(--cad-axis)" text-anchor="middle">5</text>
        </g>

        <!-- 2. TƯỜNG XÂY (WALLS) -->
        <g id="layer-wall-plan1" class="cad-layer">
          <!-- Tường bao mặt sau: X = 1098, dày 200mm (từ Y=140 đến Y=479) -->
          <rect x="1088" y="140" width="20" height="339" fill="none" stroke="var(--cad-wall)" stroke-width="2.5" />
          <!-- Khoang cửa sau tại X = 1098: rộng 850mm từ Y = 360 đến 445 -->
          <rect x="1088" y="360" width="20" height="85" fill="var(--paper-bg)" stroke="none" />
          <line x1="1088" y1="360" x2="1108" y2="360" stroke="var(--cad-wall)" stroke-width="2" />
          <line x1="1088" y1="445" x2="1108" y2="445" stroke="var(--cad-wall)" stroke-width="2" />

          <!-- Tường bao hông dưới (Trục B): chạy suốt từ X = 0 đến 1098, dày 200mm (Y: 130 -> 150) -->
          <rect x="0" y="130" width="1098" height="20" fill="none" stroke="var(--cad-wall)" stroke-width="2.5" />

          <!-- Tường bao hông trên (Trục A): chạy từ góc vát X = 205 đến X = 1098, dày 200mm (Y: 475 -> 495) -->
          <rect x="205" y="475" width="893" height="20" fill="none" stroke="var(--cad-wall)" stroke-width="2.5" />
          <!-- Cửa sổ hông tại X = 350 -> 470 (rộng 1200mm) -->
          <rect x="350" y="475" width="120" height="20" fill="var(--paper-bg)" stroke="none" />
          <line x1="350" y1="475" x2="350" y2="495" stroke="var(--cad-wall)" stroke-width="2" />

  <script>
    // --- ZOOM & PAN ENGINE ---
    let scale = 1.0;
    let pointX = 0;
    let pointY = 0;
    let isPanning = false;
    let startX = 0;
    let startY = 0;

    const svg = document.getElementById('cad-svg');
    const container = document.getElementById('viewport-container');

    function updateTransform() {
      svg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    function fitToScreen() {
      const pad = 30;
      const cW = container.clientWidth - pad * 2;
      const cH = container.clientHeight - pad * 2;
      const sW = 1680;
      const sH = 1188;

      scale = Math.min(cW / sW, cH / sH);
      pointX = (container.clientWidth - sW * scale) / 2;
      pointY = (container.clientHeight - sH * scale) / 2;
      updateTransform();
    }

    // Event mouse drag pan
    container.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // Chỉ chuột trái
      isPanning = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => { isPanning = false; });

    // Event mouse wheel zoom
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const xs = (e.clientX - container.getBoundingClientRect().left - pointX) / scale;
      const ys = (e.clientY - container.getBoundingClientRect().top - pointY) / scale;
      const delta = -e.deltaY;

      if (delta > 0) scale *= 1.15;
      else scale /= 1.15;

      scale = Math.max(0.2, Math.min(scale, 5.0));

      pointX = (e.clientX - container.getBoundingClientRect().left) - xs * scale;
      pointY = (e.clientY - container.getBoundingClientRect().top) - ys * scale;
      updateTransform();
    }, { passive: false });

    // Mobile touch events (Pinch zoom & pan)
    let initialTouchDist = 0;
    let initialTouchScale = 1;

    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isPanning = true;
        startX = e.touches[0].clientX - pointX;
        startY = e.touches[0].clientY - pointY;
      } else if (e.touches.length === 2) {
        isPanning = false;
        initialTouchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialTouchScale = scale;
      }
    }, { passive: true });

    container.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isPanning) {
        pointX = e.touches[0].clientX - startX;
        pointY = e.touches[0].clientY - startY;
        updateTransform();
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (initialTouchDist > 0) {
          scale = Math.max(0.2, Math.min(initialTouchScale * (dist / initialTouchDist), 5.0));
          updateTransform();
        }
      }
    }, { passive: true });

    container.addEventListener('touchend', () => {
      isPanning = false;
      initialTouchDist = 0;
    });

    function zoomIn() {
      scale = Math.min(scale * 1.25, 5.0);
      updateTransform();
    }
    function zoomOut() {
      scale = Math.max(scale / 1.25, 0.2);
      updateTransform();
    }
    function resetZoom() {
      fitToScreen();
    }

    // --- VIEW MODE CONTROLS ---
    function setViewMode(mode) {
      document.querySelectorAll('.toolbar-group .cad-btn').forEach(b => {
        if (b.id && b.id.startsWith('btn-view-')) b.classList.remove('active');
      });

      const pDim = document.getElementById('plan-dim-group');
      const pArch = document.getElementById('plan-arch-group');

      if (mode === 'all') {
        document.getElementById('btn-view-all').classList.add('active');
        pDim.style.display = 'block';
        pArch.style.display = 'block';
        fitToScreen();
      } else if (mode === 'dim') {
        document.getElementById('btn-view-dim').classList.add('active');
        pDim.style.display = 'block';
        pArch.style.display = 'none';
        // Focus vào bản vẽ kích thước
        scale = 1.35;
        pointX = (container.clientWidth - 1680 * scale) / 2 + 50;
        pointY = 20;
        updateTransform();
      } else if (mode === 'arch') {
        document.getElementById('btn-view-arch').classList.add('active');
        pDim.style.display = 'none';
        pArch.style.display = 'block';
        // Focus vào bản vẽ công năng
        scale = 1.35;
        pointX = (container.clientWidth - 1680 * scale) / 2 + 50;
        pointY = -480 * scale;
        updateTransform();
      }
    }

    // --- LAYER CONTROLS ---
    function toggleLayer(layerId, isChecked) {
      // Map checkbox với các layer element
      const layerMap = {
        'layer-axis': ['layer-axis-plan1', 'layer-axis-plan2'],
        'layer-dim': ['layer-dim-plan1'],
        'layer-col': ['layer-col-plan1', 'layer-col-plan2'],
        'layer-wall': ['layer-wall-plan1', 'layer-wall-plan2'],
        'layer-stair': ['layer-stair-plan1', 'layer-stair-plan2'],
        'layer-furn': ['layer-furn-plan2']
      };

      const ids = layerMap[layerId] || [];
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = isChecked ? 'inline' : 'none';
      });
    }

    // --- THEME CYCLING ---
    const themes = ['theme-paper', 'theme-cad', 'theme-blueprint'];
    const themeNames = ['🎨 Nền Giấy In', '💻 AutoCAD Đen', '🔷 Blueprint Xanh'];
    let currentThemeIdx = 0;

    function cycleTheme() {
      currentThemeIdx = (currentThemeIdx + 1) % themes.length;
      document.body.className = themes[currentThemeIdx];
      document.getElementById('btn-theme').innerHTML = themeNames[currentThemeIdx];
    }

    // Khởi tạo căn vừa màn hình khi tải trang
    window.addEventListener('load', fitToScreen);
    window.addEventListener('resize', fitToScreen);
  </script>
